name: Satori CRM hourly assistant

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: satori-crm-hourly-assistant
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Audit CRM clients, messages, projects and economics
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          systemctl is-active --quiet satori-crm-v2
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:3020/api/assistant \
            -H 'Content-Type: application/json' \
            --data '{"action":"run","notify":true}' \
            >/tmp/satori-assistant.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/satori-assistant.json'))
          run=data.get('latestRun') or {}
          print('Satori assistant:', 'critical=', run.get('critical_count', 0), 'warning=', run.get('warning_count', 0), 'cleaned=', run.get('cleaned_duplicates', 0))
          PY
          REMOTE
