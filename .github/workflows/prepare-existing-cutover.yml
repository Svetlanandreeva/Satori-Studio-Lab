name: Prepare existing CRM cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-existing-cutover.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Expose real config path to the already-reviewed cutover workflow
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          real=/etc/nginx/conf.d/satori-crm.conf
          pointer=/etc/nginx/sites-enabled/.satori-crm-cutover
          test -f "$real"
          mkdir -p /etc/nginx/sites-enabled
          rm -f "$pointer"
          ln -s "$real" "$pointer"
          test "$(readlink -f "$pointer")" = "$real"

          # sites-enabled is loaded by this server. The pointer is intentionally
          # hidden: normal wildcard includes do not match leading-dot files.
          # Prove that assumption before any production cutover is allowed.
          if ! nginx -t >/tmp/satori-cutover-nginx-test.log 2>&1; then
            rm -f "$pointer"
            cat /tmp/satori-cutover-nginx-test.log >&2
            exit 1
          fi

          # grep -R used by the reviewed cutover workflow must still discover it.
          grep -RIl 'crm\.satorilabural\.online' /etc/nginx/sites-enabled | grep -Fx "$pointer" >/dev/null
          echo 'Hidden, Nginx-safe config pointer prepared'
          REMOTE
