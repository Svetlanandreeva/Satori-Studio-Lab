name: Prepare existing CRM cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-existing-cutover.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Expose real config path to the already-reviewed cutover workflow
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          real=/etc/nginx/conf.d/satori-crm.conf
          test -f "$real"
          mkdir -p /etc/nginx/sites-enabled
          if grep -Eq '^[[:space:]]*include[[:space:]]+/etc/nginx/sites-enabled/' /etc/nginx/nginx.conf; then
            echo 'sites-enabled is included by nginx; refusing temporary pointer' >&2
            exit 1
          fi
          ln -sfn "$real" /etc/nginx/sites-enabled/satori-crm.conf
          test "$(readlink -f /etc/nginx/sites-enabled/satori-crm.conf)" = "$real"
          echo 'Temporary non-loaded config pointer prepared'
          REMOTE
