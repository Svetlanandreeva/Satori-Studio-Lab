name: Audit CRM integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-crm-integrity.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install audit tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Clone current CRM UI
        run: git clone --depth=1 --branch main https://github.com/Svetlanandreeva/CRM.git /tmp/satori-crm
      - name: Audit UI and backend for placeholders, stubs and disconnected state
        shell: bash
        run: |
          set +e
          echo '=== CRM UI VERSION ==='
          git -C /tmp/satori-crm rev-parse HEAD
          echo
          echo '=== 1. HARDCODED CALENDAR DATES / CLOCKS ==='
          rg -n --glob '*.{ts,tsx,js,jsx}' "20[0-9]{2}-[01][0-9]-[0-3][0-9]|new Date\(['\"]20[0-9]{2}" /tmp/satori-crm/src /tmp/satori-crm/server.ts || true
          echo
          echo '=== 2. PLACEHOLDER / MOCK / DEMO / SIMULATED / STUB LANGUAGE ==='
          rg -ni --glob '*.{ts,tsx,js,jsx}' "mock|demo|placeholder|simulat|stub|заглуш|тестов(ый|ая|ое|ые)|пример данных|fake" /tmp/satori-crm/src /tmp/satori-crm/server.ts crm-v2/overrides/src || true
          echo
          echo '=== 3. EXPLICIT STUBS / NO-OPS / FAKE SUCCESS PATHS ==='
          rg -n --glob '*.{ts,tsx,js,jsx}' "return null;|=>null|success:false|success: false|throw new Error\(['\"]TODO|TODO|FIXME|not implemented|не подключ|Используйте живой канал" /tmp/satori-crm/src /tmp/satori-crm/server.ts crm-v2/overrides/src || true
          echo
          echo '=== 4. DOMAIN STATE STORED ONLY IN BROWSER LOCALSTORAGE ==='
          rg -n --glob '*.{ts,tsx}' "localStorage\.(getItem|setItem|removeItem)" /tmp/satori-crm/src || true
          echo
          echo '=== 5. TIMERS / ARTIFICIAL PROGRESS ==='
          rg -n --glob '*.{ts,tsx}' "setTimeout|new Promise\(r => setTimeout|new Promise\(.*setTimeout" /tmp/satori-crm/src || true
          echo
          echo '=== 6. CONTEXT MUTATIONS AND WHETHER THEY CALL LIVE API ==='
          rg -n "const (add|update|delete|bulk|trigger|run|send|reset)[A-Z][A-Za-z0-9_]*\s*=|jsonFetch\(" /tmp/satori-crm/src/context/LiveCrmContext.tsx || true
          echo
          echo '=== 7. APP ROUTES ==='
          rg -n "tab ===|'client_cockpit'|'production'|'tasks'|'catalog'|'contractors'|'analytics'|'integrations'" /tmp/satori-crm/src/App.tsx || true
          echo
          echo '=== 8. SIDEBAR NAVIGATION ==='
          rg -n "id: '" /tmp/satori-crm/src/components/common/Sidebar.tsx || true
          echo
          echo '=== 9. ACTIVE VIEW IMPORTS ==='
          sed -n '1,180p' /tmp/satori-crm/src/App.tsx
          echo
          echo '=== 10. BACKEND API ROUTE FILES ==='
          find crm-v2/overrides/src/app/api -type f -name 'route.ts' | sort || true
          echo
          echo '=== 11. UI FETCHED API PATHS ==='
          rg -no --glob '*.{ts,tsx}' '(/api/[A-Za-z0-9_?=&./${}-]+)' /tmp/satori-crm/src /tmp/satori-crm/server.ts | sort -u || true
          echo
          echo '=== 12. BUTTONS WITH NO onClick/onSubmit/href ON SAME OPENING TAG (heuristic) ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('/tmp/satori-crm/src').rglob('*.tsx'):
              text=p.read_text(errors='ignore')
              for m in re.finditer(r'<button\b([^>]*)>', text, re.S):
                  attrs=m.group(1)
                  if not any(x in attrs for x in ('onClick=', 'onSubmit=', 'type="submit"', "type='submit'", 'formAction=')):
                      line=text.count('\n',0,m.start())+1
                      snippet=' '.join(m.group(0).split())[:220]
                      print(f'{p}:{line}: {snippet}')
          PY
