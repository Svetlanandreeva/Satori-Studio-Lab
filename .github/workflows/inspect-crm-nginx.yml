name: Inspect CRM Nginx routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crm-nginx.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect enabled Nginx CRM route
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          echo '=== enabled files ==='
          find /etc/nginx -maxdepth 3 \( -type f -o -type l \) | sort | grep -E 'sites|conf.d' || true
          echo '=== domain matches ==='
          grep -RIn 'crm.satorilabural.online' /etc/nginx 2>/dev/null || true
          echo '=== CRM upstream matches ==='
          grep -RInE '127\.0\.0\.1:(3010|3020|3030)' /etc/nginx 2>/dev/null || true
          echo '=== relevant nginx -T ==='
          nginx -T 2>/dev/null | grep -B10 -A30 -E 'crm\.satorilabural\.online|127\.0\.0\.1:(3010|3020|3030)' || true
          echo '=== local responses ==='
          curl -sS -o /dev/null -w '3020 root: %{http_code}\n' http://127.0.0.1:3020/ || true
          curl -sS -o /dev/null -w '3030 root: %{http_code}\n' http://127.0.0.1:3030/ || true
          curl -k -sS -o /dev/null -w 'public root: %{http_code}\n' https://crm.satorilabural.online/ || true
          REMOTE
