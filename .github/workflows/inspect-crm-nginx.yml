name: Inspect CRM Nginx routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crm-nginx.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect enabled Nginx CRM route
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          echo '=== enabled files ==='
          find /etc/nginx -maxdepth 3 -type f -o -type l | sort | grep -E 'sites|conf.d' || true
          echo '=== domain matches ==='
          grep -RIn 'crm.satorilabural.online' /etc/nginx 2>/dev/null || true
          echo '=== port 3010 matches ==='
          grep -RIn '3010' /etc/nginx 2>/dev/null || true
          echo '=== relevant nginx -T ==='
          nginx -T 2>/dev/null | grep -B8 -A18 -E 'crm\.satorilabural\.online|127\.0\.0\.1:3010|localhost:3010' || true
          REMOTE
