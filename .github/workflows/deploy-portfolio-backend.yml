name: Deploy Satori portfolio admin backend

on:
  workflow_dispatch:

concurrency:
  group: portfolio-backend-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ vars.SATORI_DEPLOY_HOST || '194.226.97.103' }}
  DEPLOY_PORT: ${{ vars.SATORI_DEPLOY_PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check backend JavaScript
        run: |
          node --check server/index.js
          node --check server/portfolio.js
          node --check server/auth.js
          node --check promo/adm.js
          node --check promo/portfolio-cards.js
          node --input-type=module -e 'import { listPortfolio } from "./server/portfolio.js"; const {projects}=await listPortfolio(); if (projects.length < 1 || projects.some(p=>!p.images.length)) process.exit(1); console.log("Portfolio seed OK:", projects.length, "projects")'

      - name: Connect to Satori server
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check SSH reachability and trust server host key
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_PORT" in
            ''|*[!0-9]*) echo "::error::SATORI_DEPLOY_PORT must be numeric"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf 'Checking Satori SSH endpoint %s:%s\n' "$DEPLOY_HOST" "$DEPLOY_PORT"
          for attempt in 1 2 3; do
            echo "SSH check: attempt $attempt of 3"
            if ssh-keyscan -T 8 -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$RUNNER_TEMP/satori-host-keys" 2>/dev/null && test -s "$RUNNER_TEMP/satori-host-keys"; then
              cat "$RUNNER_TEMP/satori-host-keys" >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "SSH host key received."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error title=SSH server unavailable::Could not connect to $DEPLOY_HOST:$DEPLOY_PORT. Deployment NOT attempted. Check VPS status, SSH service, firewall, current IP and SSH port. Change repository Actions variables SATORI_DEPLOY_HOST / SATORI_DEPLOY_PORT if required."
          exit 1

      - name: Deploy backend without changing stored data or uploaded photos
        run: |
          rsync -az \
            -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            --exclude 'data/' \
            --exclude 'uploads/' \
            --exclude '.env' \
            server/ "root@$DEPLOY_HOST:/var/www/satori/backend/"

      - name: Restart and check portfolio API
        run: |
          ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" 'set -eu; systemctl restart satori-backend; systemctl is-active --quiet satori-backend; curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 2 --max-time 10 http://127.0.0.1:3001/api/products >/dev/null; curl --fail --silent --show-error --retry 8 --retry-delay 2 --max-time 10 http://127.0.0.1:3001/api/portfolio >/dev/null; echo "Portfolio backend: OK"'
