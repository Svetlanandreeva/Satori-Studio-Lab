name: Apply Satori CRM v2 production cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-crm-v2-cutover.yml'
  workflow_dispatch:

concurrency:
  group: crm-v2-apply-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Switch CRM Nginx route to Auto-CRM v2
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          cfg=/etc/nginx/conf.d/satori-crm.conf
          test -f "$cfg"
          test -s /etc/nginx/.htpasswd-satori-crm
          systemctl is-active --quiet satori-crm-v2
          curl --fail --silent http://127.0.0.1:3020/api/pipeline | grep -q 'Новый запрос'

          stamp=$(date +%Y%m%d-%H%M%S)
          backup=/var/backups/satori-crm-production-$stamp
          mkdir -p "$backup"
          chmod 0700 "$backup"
          cp -a "$cfg" "$backup/satori-crm.conf"
          cp -a /var/lib/satori-auto-crm/crm.db "$backup/crm-v2.db"
          printf '%s\n' "$backup" >/var/lib/satori-auto-crm/last-production-backup

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/nginx/conf.d/satori-crm.conf')
          s=p.read_text()
          old='        proxy_pass http://127.0.0.1:3010;'
          new='        proxy_pass http://127.0.0.1:3020;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected CRM proxy_pass not found')
          auth='        auth_basic "Satori CRM";\n        auth_basic_user_file /etc/nginx/.htpasswd-satori-crm;\n'
          if 'auth_basic_user_file /etc/nginx/.htpasswd-satori-crm;' not in s:
              marker='    location / {\n'
              if marker not in s:
                  raise SystemExit('CRM location block not found')
              s=s.replace(marker, marker+auth, 1)
          p.write_text(s)
          PY

          nginx -t
          systemctl reload nginx

          # Public requests without login must be rejected.
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://crm.satorilabural.online/)
          test "$code" = '401'

          # Verify the new application directly behind Nginx.
          curl --fail --silent http://127.0.0.1:3020/ >/dev/null
          curl --fail --silent http://127.0.0.1:3020/api/deals >/tmp/live-crm-deals.json
          python3 - <<'PY'
          import json
          deals=json.load(open('/tmp/live-crm-deals.json'))
          assert len(deals) >= 8, f'Expected migrated deals, got {len(deals)}'
          print(f'Production Auto-CRM verified with {len(deals)} deals')
          PY

          # Legacy stays on localhost:3010 for rollback only.
          systemctl is-active --quiet satori-crm
          curl --fail --silent http://127.0.0.1:3010/health >/dev/null
          echo 'Production cutover complete; legacy rollback service retained on 3010'
          REMOTE
