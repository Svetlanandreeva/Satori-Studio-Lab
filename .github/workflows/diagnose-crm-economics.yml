name: Diagnose CRM economics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crm-economics.yml'
  workflow_dispatch:

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Correct target deal and verify live data
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          DEAL_ID='135396a1-962d-4706-b704-6ec25dba7028'
          CALC_STAGE_ID='9de72c0f-850d-4ec4-99dd-a08dd1473bd2'

          curl --fail --silent -X PUT \
            -H 'Content-Type: application/json' \
            --data "{\"dealId\":\"$DEAL_ID\",\"receivedAmount\":0,\"productionCost\":0,\"paymentCommission\":0,\"paymentCommissionRate\":0,\"deliveryCost\":0,\"packagingCost\":0,\"contractorCost\":0,\"taxCost\":0,\"otherCost\":0}" \
            http://127.0.0.1:3020/api/economics >/tmp/correct-economics.json

          curl --fail --silent -X PUT \
            -H 'Content-Type: application/json' \
            --data "{\"dealId\":\"$DEAL_ID\",\"stageId\":\"$CALC_STAGE_ID\"}" \
            http://127.0.0.1:3020/api/pipeline >/tmp/correct-stage.json

          curl --fail --silent http://127.0.0.1:3020/api/economics >/tmp/economics-after.json
          curl --fail --silent http://127.0.0.1:3020/api/pipeline >/tmp/pipeline-after.json
          /opt/node22/bin/node <<'NODE'
          const fs=require('fs');
          const dealId='135396a1-962d-4706-b704-6ec25dba7028';
          const economics=JSON.parse(fs.readFileSync('/tmp/economics-after.json','utf8'));
          const pipeline=JSON.parse(fs.readFileSync('/tmp/pipeline-after.json','utf8'));
          const row=(economics.deals||[]).find(x=>x.dealId===dealId);
          const stage=(pipeline||[]).find(s=>(s.deals||[]).some(d=>d.id===dealId));
          if(!row) throw new Error('Target deal missing from economics');
          if(Number(row.receivedAmount||0)!==0) throw new Error('receivedAmount was not cleared');
          if(!stage || stage.name!=='Расчёт') throw new Error('Deal was not moved to Расчёт');
          console.log('CORRECTED_DEAL='+JSON.stringify({dealId:row.dealId,title:row.dealTitle,dealValueRub:Number(row.dealValue||0)/100,receivedRub:Number(row.receivedAmount||0)/100,stage:stage.name},null,2));
          NODE
          REMOTE
