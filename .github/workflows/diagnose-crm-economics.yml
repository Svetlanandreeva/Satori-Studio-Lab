name: Diagnose CRM economics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crm-economics.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Print received amounts from live economics API
        run: |
          ssh root@194.226.97.103 "curl --fail --silent http://127.0.0.1:3020/api/economics" > /tmp/economics.json
          node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('/tmp/economics.json','utf8'));
          const rows=(v.deals||[]).filter(x=>Number(x.receivedAmount||0)>0).map(x=>({
            dealId:x.dealId,
            client:x.contactName,
            deal:x.dealTitle,
            stage:x.stageName,
            receivedRub:Number(x.receivedAmount||0)/100,
            economicsUpdatedAt:x.economicsUpdatedAt||x.updatedAt||null,
          }));
          console.log('LIVE_RECEIVED_ROWS='+JSON.stringify(rows,null,2));
          console.log('LIVE_RECEIVED_TOTAL_RUB='+rows.reduce((s,x)=>s+x.receivedRub,0));
          NODE
