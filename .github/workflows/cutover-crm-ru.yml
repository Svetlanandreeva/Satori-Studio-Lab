name: Cut over CRM to crm.crmsatori.ru

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-crm-ru.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check DNS readiness
        id: dns
        run: |
          set -eu
          echo '=== crm.crmsatori.ru DNS ==='
          auth=$(dig +short @ns1.hosting.reg.ru crm.crmsatori.ru A | tail -1)
          cf=$(dig +short @1.1.1.1 crm.crmsatori.ru A | tail -1)
          gg=$(dig +short @8.8.8.8 crm.crmsatori.ru A | tail -1)
          echo "authoritative=$auth"
          echo "cloudflare=$cf"
          echo "google=$gg"

          if [ "$auth" != "194.226.97.103" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'REG.RU hosting DNS does not currently expose the expected CRM record.'
            exit 0
          fi

          if [ "$cf" = "194.226.97.103" ] && [ "$gg" = "194.226.97.103" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Public DNS is ready. Continuing cutover.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Record is correct at REG.RU but public DNS propagation is still pending. The scheduled workflow will retry automatically.'
          fi

      - uses: webfactory/ssh-agent@v0.9.0
        if: steps.dns.outputs.ready == 'true'
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust production server
        if: steps.dns.outputs.ready == 'true'
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Configure crm.crmsatori.ru and certificate
        if: steps.dns.outputs.ready == 'true'
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          old=/etc/nginx/conf.d/satori-crm.conf
          new=/etc/nginx/conf.d/crm-crmsatori.conf
          tmp=/etc/nginx/conf.d/crm-crmsatori-acme.conf
          stamp=$(date +%Y%m%d-%H%M%S)
          mkdir -p /var/backups/satori-crm-hostname-$stamp
          cp -a "$old" /var/backups/satori-crm-hostname-$stamp/satori-crm.conf

          cat >"$tmp" <<'NGINX'
          server {
              listen 192.168.0.38:80;
              server_name crm.crmsatori.ru;
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
                  default_type text/plain;
                  try_files $uri =404;
              }
              location / { return 301 https://$host$request_uri; }
          }
          NGINX

          nginx -t
          systemctl reload nginx
          mkdir -p /var/www/letsencrypt

          if [ ! -f /etc/letsencrypt/live/crm.crmsatori.ru/fullchain.pem ]; then
            certbot certonly --webroot -w /var/www/letsencrypt \
              -d crm.crmsatori.ru \
              --non-interactive --agree-tos --register-unsafely-without-email
          fi

          python3 - <<'PY'
          from pathlib import Path
          src=Path('/etc/nginx/conf.d/satori-crm.conf').read_text()
          src=src.replace('crm.satorilabural.online','crm.crmsatori.ru')
          src=src.replace('/etc/letsencrypt/live/crm.satorilabural.online/fullchain.pem','/etc/letsencrypt/live/crm.crmsatori.ru/fullchain.pem')
          src=src.replace('/etc/letsencrypt/live/crm.satorilabural.online/privkey.pem','/etc/letsencrypt/live/crm.crmsatori.ru/privkey.pem')
          Path('/etc/nginx/conf.d/crm-crmsatori.conf').write_text(src)
          PY

          rm -f "$tmp"
          nginx -t
          systemctl reload nginx

          curl --fail --silent --show-error --resolve crm.crmsatori.ru:443:192.168.0.38 \
            https://crm.crmsatori.ru/login >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3030/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3020/api/deals >/dev/null
          echo 'crm.crmsatori.ru is configured and healthy.'
          REMOTE

      - name: Verify crm.crmsatori.ru externally
        if: steps.dns.outputs.ready == 'true'
        run: |
          curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://crm.crmsatori.ru/login >/dev/null
          echo 'crm.crmsatori.ru is externally reachable.'

      - name: DNS still propagating
        if: steps.dns.outputs.ready != 'true'
        run: |
          echo 'No action required. DNS is still propagating; this workflow will retry automatically every 30 minutes.'
