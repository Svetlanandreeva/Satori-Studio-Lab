name: Diagnose CRM access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crm-access.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Check web listener and ISPmanager blocks
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          echo '=== listeners ==='
          ss -ltnp | grep -E ':(80|443|3020|3030)\b' || true
          echo '=== crm nginx listen directives ==='
          nginx -T 2>/dev/null | grep -B4 -A14 'server_name crm.satorilabural.online' || true
          echo '=== ISPmanager block-set sizes ==='
          for s in ispmgr_deny_ip ispmgr_deny_sub ispmgr_limit_req; do
            echo "-- $s --"
            ipset list "$s" 2>/dev/null | grep -E 'Name:|Number of entries:|Members:' -A20 || true
          done
          echo '=== input policy ==='
          iptables -L INPUT -n -v --line-numbers 2>/dev/null | head -80 || true
          echo '=== local health ==='
          curl -sS -o /dev/null -w 'ui=%{http_code}\n' http://127.0.0.1:3030/health || true
          curl -sS -o /dev/null -w 'api=%{http_code}\n' http://127.0.0.1:3020/api/deals || true
          REMOTE
      - name: Check public CRM
        run: |
          curl -4 -v --connect-timeout 10 --max-time 20 https://crm.satorilabural.online/login -o /dev/null
