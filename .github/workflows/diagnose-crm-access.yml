name: Diagnose CRM access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crm-access.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare public DNS and HTTPS
        run: |
          set +e
          echo '=== DNS CRM ==='
          getent ahostsv4 crm.satorilabural.online
          echo '=== DNS MAIN ==='
          getent ahostsv4 satorilabural.ru
          echo '=== CRM HTTPS ==='
          curl -4 -I -v --connect-timeout 10 --max-time 20 https://crm.satorilabural.online/login
          echo '=== MAIN HTTPS ==='
          curl -4 -I -v --connect-timeout 10 --max-time 20 https://satorilabural.ru/
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Compare nginx virtual hosts
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          echo '=== listeners ==='
          ss -ltnp | grep -E ':(80|443|3020|3030)\b' || true
          echo '=== CRM config ==='
          grep -RInE 'server_name crm\.satorilabural\.online|listen .*443|listen .*80' /etc/nginx 2>/dev/null | head -120
          echo '=== MAIN SITE config ==='
          grep -RInE 'server_name .*satorilabural\.ru|listen .*443|listen .*80' /etc/nginx 2>/dev/null | head -220
          echo '=== CRM full vhost excerpt ==='
          nginx -T 2>/dev/null | awk '/server_name crm\.satorilabural\.online/{show=1;c=0} show{print;c++} c>100{show=0}' | head -140
          echo '=== MAIN full vhost excerpt ==='
          nginx -T 2>/dev/null | awk '/server_name .*satorilabural\.ru/{show=1;c=0} show{print;c++} c>100{show=0}' | head -180
          echo '=== local health ==='
          curl -sS -o /dev/null -w 'ui=%{http_code}\n' http://127.0.0.1:3030/health || true
          curl -sS -o /dev/null -w 'api=%{http_code}\n' http://127.0.0.1:3020/api/deals || true
          REMOTE
