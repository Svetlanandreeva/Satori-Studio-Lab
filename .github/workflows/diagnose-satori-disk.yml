name: Diagnose Satori VPS disk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-satori-disk.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect remaining disk usage
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -u
          echo '=== df -h ==='
          df -h /
          echo '=== root directories ==='
          du -xhd1 / 2>/dev/null | sort -h
          echo '=== /root ==='
          du -xhd2 /root 2>/dev/null | sort -h | tail -40
          echo '=== /var/log ==='
          du -xhd2 /var/log 2>/dev/null | sort -h | tail -40
          echo '=== /var/www/satori ==='
          du -xhd2 /var/www/satori 2>/dev/null | sort -h | tail -40
          echo '=== /var/lib ==='
          du -xhd2 /var/lib 2>/dev/null | sort -h | tail -50
          echo '=== /opt ==='
          du -xhd2 /opt 2>/dev/null | sort -h | tail -40
          echo '=== Docker ==='
          docker system df 2>/dev/null || true
          REMOTE
