name: Verify economics rejected-deal filter

on:
  push:
    branches: [fix/economics-hide-rejected]
    paths:
      - 'crm-v2/**'
      - '.github/workflows/verify-economics-rejection.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production-like CRM build
        run: |
          git clone --filter=blob:none https://github.com/Hainrixz/auto-crm.git /tmp/satori-auto-crm
          cd /tmp/satori-auto-crm
          git checkout --detach 0aef51a9aef0487c59b964b4eea9d964a2321f0c
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/satori-auto-crm')
          p=root/'next.config.ts'
          s=p.read_text().replace('const nextConfig: NextConfig = {\n  serverExternalPackages: ["better-sqlite3"],\n};','const nextConfig: NextConfig = {\n  output: "standalone",\n  serverExternalPackages: ["better-sqlite3"],\n};')
          p.write_text(s)
          p=root/'src/db/index.ts'
          p.write_text(p.read_text().replace('const DB_PATH = path.join(process.cwd(), "data", "crm.db");','const DB_PATH = process.env.CRM_DB_PATH || path.join(process.cwd(), "data", "crm.db");'))
          PY
          python3 crm-v2/russianize.py
          cp -a crm-v2/overrides/src/. /tmp/satori-auto-crm/src/
          cd /tmp/satori-auto-crm
          npm ci
          npm run build
          test -f .next/standalone/server.js
