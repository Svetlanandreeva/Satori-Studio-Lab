name: Deploy Satori admin design

on:
  push:
    branches: [main]
    paths: [src/**, index.html, vite.config.ts, package.json, package-lock.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Сервер 91.229.11.198 сам забирает main каждые 2 минуты и собирает админку
      # (scripts/server/satori-full-sync.sh). Здесь только ждём, пока новая версия появится на сайте.
      - name: Wait until the live admin serves this build
        run: |
          css_path=$(grep -oE '/assets/[^"]+\.css' dist/index.html | head -n 1)
          test -n "$css_path"
          for i in $(seq 1 40); do
            if curl -fsSL --max-time 20 "https://satorilabural.ru/admin?revision=$GITHUB_SHA" | grep -qF "$css_path"; then
              echo "Live admin serves $css_path"; exit 0
            fi
            sleep 30
          done
          echo "::error::За 20 минут новая админка не появилась на сайте. Журнал сборки на сервере: /tmp/satori-frontend-build.log"
          exit 1
