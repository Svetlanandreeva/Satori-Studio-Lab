name: Update CRM seasonality

# Раз в месяц берёт свежую динамику запросов Вордстата (Yandex Search API в Yandex Cloud)
# и обновляет файлы сезонности для админки и CRM. Сервер сам подтянет изменение из main.
# Нужны секреты YANDEX_SEARCH_API_KEY и YANDEX_FOLDER_ID; без них workflow ничего не меняет.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-seasonality
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Wordstat dynamics and recompute indices
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: node scripts/update-seasonality.mjs
      - name: Commit if data changed
        run: |
          if git diff --quiet -- crm/public/seasonality-data.json public/seasonality-data.json; then
            echo "Данные не изменились"; exit 0
          fi
          git config user.name "satori-bot"
          git config user.email "satori-bot@users.noreply.github.com"
          git add crm/public/seasonality-data.json public/seasonality-data.json
          git commit -m "Update CRM seasonality from Wordstat"
          git push
