name: Deploy current CRM UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-current-crm-ui.yml'
  workflow_dispatch:

concurrency:
  group: current-satori-crm-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and build CRM UI
        run: |
          git clone --depth=1 --branch main https://github.com/Svetlanandreeva/CRM.git /tmp/satori-crm
          cd /tmp/satori-crm
          git rev-parse HEAD | tee /tmp/crm-version
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=server.js
          test -f dist/index.html
          test -f server.js
          grep -R -q 'Карточка и переписка' dist/assets
          grep -R -q 'Клиенты' dist/assets

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Deploy UI and smoke-test live CRM data paths
        run: |
          ssh root@194.226.97.103 'mkdir -p /var/www/satori/crm-new-ui'
          rsync -az --delete /tmp/satori-crm/dist/ root@194.226.97.103:/var/www/satori/crm-new-ui/dist/
          rsync -az /tmp/satori-crm/server.js /tmp/satori-crm/package.json root@194.226.97.103:/var/www/satori/crm-new-ui/
          scp /tmp/crm-version root@194.226.97.103:/var/www/satori/crm-new-ui/VERSION
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          export PATH=/opt/node22/bin:$PATH
          cd /var/www/satori/crm-new-ui
          /opt/node22/bin/npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          systemctl restart satori-crm-ui
          systemctl is-active --quiet satori-crm-ui
          curl --fail --silent --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:3030/health >/dev/null
          grep -R -q 'Карточка и переписка' dist/assets
          grep -R -q 'Клиенты' dist/assets

          # Core API paths used by dashboard, deals and client history must all be live.
          curl --fail --silent http://127.0.0.1:3020/api/deals >/tmp/crm-smoke-deals.json
          curl --fail --silent http://127.0.0.1:3020/api/contacts >/tmp/crm-smoke-contacts.json
          curl --fail --silent 'http://127.0.0.1:3020/api/inbox?filter=client&search=' >/tmp/crm-smoke-inbox.json
          curl --fail --silent 'http://127.0.0.1:3020/api/messages/telegram?search=' >/tmp/crm-smoke-telegram.json

          contact_id=$(/opt/node22/bin/node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/crm-smoke-contacts.json','utf8'));const rows=Array.isArray(v)?v:(Array.isArray(v.contacts)?v.contacts:[]);process.stdout.write(rows[0]?.id||'')")
          if [ -n "$contact_id" ]; then
            curl --fail --silent "http://127.0.0.1:3020/api/contacts/$contact_id/timeline" >/tmp/crm-smoke-timeline.json
            /opt/node22/bin/node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/crm-smoke-timeline.json','utf8'));if(!v.contact||!Array.isArray(v.history))process.exit(1)"
          fi

          /opt/node22/bin/node - <<'NODE'
          const fs=require('fs');
          const deals=JSON.parse(fs.readFileSync('/tmp/crm-smoke-deals.json','utf8'));
          const contacts=JSON.parse(fs.readFileSync('/tmp/crm-smoke-contacts.json','utf8'));
          const inbox=JSON.parse(fs.readFileSync('/tmp/crm-smoke-inbox.json','utf8'));
          const telegram=JSON.parse(fs.readFileSync('/tmp/crm-smoke-telegram.json','utf8'));
          if(!Array.isArray(deals)) throw new Error('Deals API is not an array');
          if(!Array.isArray(contacts) && !Array.isArray(contacts.contacts)) throw new Error('Contacts API has unexpected shape');
          if(!Array.isArray(inbox.threads)) throw new Error('Inbox API has unexpected shape');
          if(!Array.isArray(telegram.threads)) throw new Error('Telegram API has unexpected shape');
          console.log(`CRM smoke OK: ${deals.length} deals, ${Array.isArray(contacts)?contacts.length:contacts.contacts.length} contacts, ${inbox.threads.length} email threads, ${telegram.threads.length} telegram threads`);
          NODE
          REMOTE

      - name: Verify current public CRM host
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://crm.crmsatori.ru/login)
          test "$code" = '200'
          echo "crm.crmsatori.ru/login -> $code"

# redeploy CRM commit 2334464537e44dc0812391fa5c4d7a046a92b5cc with connected client cards
