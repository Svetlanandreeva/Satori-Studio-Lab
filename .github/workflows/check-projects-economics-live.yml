name: Check live projects and economics

on:
  push:
    branches: [check/projects-economics-live]
    paths:
      - '.github/workflows/check-projects-economics-live.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Verify rejected deals are hidden from live economics
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          systemctl is-active --quiet satori-crm-v2
          curl -fsS http://127.0.0.1:3020/api/economics >/tmp/economics.json
          python3 - <<'PY'
          import collections, json
          economics=json.load(open('/tmp/economics.json'))
          deals=economics.get('deals', [])
          clients=economics.get('clients', [])
          stages=dict(collections.Counter(x.get('stageName') for x in deals))
          print('economics', {'count': len(deals), 'stages': stages})
          print('deals', [(x.get('contactName'), x.get('dealTitle'), x.get('stageName')) for x in deals])
          print('clients', [(x.get('contactName'), x.get('deals')) for x in clients])
          assert not any('отказ' in str(x.get('stageName') or '').lower().replace('ё','е') for x in deals), deals
          assert 'Отказ' not in stages, stages
          PY
          REMOTE
