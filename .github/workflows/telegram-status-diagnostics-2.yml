name: Telegram status diagnostics 2

on:
  push:
    branches:
      - debug/telegram-live-diagnostics

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Capture status failure safely
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          code=$(curl -sS -o /tmp/tg-status-body.txt -w '%{http_code}' http://127.0.0.1:3020/api/integrations/telegram/status)
          echo "status_http=$code"
          echo '=== status body ==='
          head -c 4000 /tmp/tg-status-body.txt || true
          echo
          echo '=== service state ==='
          systemctl is-active satori-crm-v2 || true
          echo '=== recent app logs ==='
          journalctl -u satori-crm-v2 --since '20 minutes ago' --no-pager 2>/dev/null | tail -n 200 || true
          echo '=== recent webhook access ==='
          if [ -f /var/log/nginx/access.log ]; then
            tail -n 1500 /var/log/nginx/access.log | grep -E '/api/integrations/(need-number|telegram/webhook)' | tail -n 80 || true
          fi
          REMOTE
