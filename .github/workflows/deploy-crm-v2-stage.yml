name: Deploy CRM v2 stage

on:
  push:
    branches: [main]
    paths:
      - 'crm-v2/**'
      - '.github/workflows/deploy-crm-v2-stage.yml'
  workflow_dispatch:

concurrency:
  group: crm-v2-stage
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/Hainrixz/auto-crm.git
  UPSTREAM_SHA: 0aef51a9aef0487c59b964b4eea9d964a2321f0c

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned MIT Auto-CRM
        run: |
          git clone --filter=blob:none "$UPSTREAM_REPO" /tmp/satori-auto-crm
          cd /tmp/satori-auto-crm
          git checkout --detach "$UPSTREAM_SHA"
          test -f LICENSE
          grep -q 'MIT License' LICENSE

      - name: Apply Satori deployment base patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/satori-auto-crm')

          # Build a self-contained Next.js runtime for the small VPS.
          p = root / 'next.config.ts'
          s = p.read_text()
          needle = 'const nextConfig: NextConfig = {\n  serverExternalPackages: ["better-sqlite3"],\n};'
          replacement = 'const nextConfig: NextConfig = {\n  output: "standalone",\n  serverExternalPackages: ["better-sqlite3"],\n};'
          if needle not in s:
              raise SystemExit('next.config.ts patch target not found')
          p.write_text(s.replace(needle, replacement))

          # Keep SQLite outside the deploy directory so code deploys cannot delete data.
          p = root / 'src/db/index.ts'
          s = p.read_text()
          needle = 'const DB_PATH = path.join(process.cwd(), "data", "crm.db");'
          replacement = 'const DB_PATH = process.env.CRM_DB_PATH || path.join(process.cwd(), "data", "crm.db");'
          if needle not in s:
              raise SystemExit('DB path patch target not found')
          p.write_text(s.replace(needle, replacement))

          # Satori branding.
          p = root / 'src/app/layout.tsx'
          s = p.read_text().replace('<html lang="es"', '<html lang="ru"')
          s = s.replace('title: "Auto-CRM - Tu CRM con Inteligencia Artificial"', 'title: "SATORI — CRM"')
          s = s.replace('description:\n    "CRM conversacional con pipeline de ventas, clasificacion automatica de leads y seguimiento inteligente. Construido con Claude Code."', 'description: "Satori CRM — клиенты, сделки и производство"')
          p.write_text(s)

          for rel in ['src/components/layout/Sidebar.tsx', 'src/components/layout/MobileNav.tsx']:
              p = root / rel
              s = p.read_text()
              mapping = {
                  'label: "Dashboard"': 'label: "Главная"',
                  'label: "Pipeline"': 'label: "Воронка"',
                  'label: "Contactos"': 'label: "Клиенты"',
                  'label: "Deals"': 'label: "Сделки"',
                  'label: "Actividades"': 'label: "Активность"',
                  'label: "Configuracion"': 'label: "Настройки"',
                  '>Auto-CRM<': '>SATORI CRM<',
                  'Auto-CRM v1.0': 'SATORI / CRM',
                  'Powered by Claude': 'Satori Studio',
              }
              for old, new in mapping.items():
                  s = s.replace(old, new)
              p.write_text(s)

          # This domain previously hosted our PWA CRM. Browsers can still have
          # that old root-scoped service worker and Cache Storage registered.
          # Keep a self-removing worker at the same URL so those old clients
          # delete the legacy caches and release the scope after the cutover.
          p = root / 'public/sw.js'
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""// Legacy Satori CRM PWA cleanup worker.\nself.addEventListener('install', () => self.skipWaiting());\nself.addEventListener('activate', (event) => {\n  event.waitUntil((async () => {\n    try {\n      const keys = await caches.keys();\n      await Promise.all(keys.map((key) => caches.delete(key)));\n    } catch (_) {}\n    try { await self.clients.claim(); } catch (_) {}\n    try { await self.registration.unregister(); } catch (_) {}\n    try {\n      const windows = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });\n      for (const client of windows) {\n        try { await client.navigate(client.url); } catch (_) {}\n      }\n    } catch (_) {}\n  })());\n});\nself.addEventListener('fetch', (event) => event.respondWith(fetch(event.request)));\n""")
          PY

      - name: Apply full Russian localization and Satori integration overrides
        run: |
          python3 crm-v2/russianize.py
          cp -a crm-v2/overrides/src/. /tmp/satori-auto-crm/src/
          grep -q 'Need Number' /tmp/satori-auto-crm/src/app/settings/page.tsx
          grep -q 'sendTelegramMessage' /tmp/satori-auto-crm/src/app/api/integrations/need-number/route.ts
          grep -q 'Поиск клиентов и сделок' /tmp/satori-auto-crm/src/components/layout/Header.tsx

      - name: Install and build Auto-CRM
        working-directory: /tmp/satori-auto-crm
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js
          test -f public/sw.js

      - name: Assemble standalone artifact
        run: |
          rm -rf /tmp/satori-auto-crm-runtime
          mkdir -p /tmp/satori-auto-crm-runtime/.next
          cp -a /tmp/satori-auto-crm/.next/standalone/. /tmp/satori-auto-crm-runtime/
          cp -a /tmp/satori-auto-crm/.next/static /tmp/satori-auto-crm-runtime/.next/static
          if [ -d /tmp/satori-auto-crm/public ]; then cp -a /tmp/satori-auto-crm/public /tmp/satori-auto-crm-runtime/public; fi
          cp /tmp/satori-auto-crm/LICENSE /tmp/satori-auto-crm-runtime/LICENSE
          printf '%s\n' "$UPSTREAM_SHA" > /tmp/satori-auto-crm-runtime/UPSTREAM_COMMIT

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust production server
        run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Install isolated Node 22 runtime
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          if [ ! -x /opt/node22/bin/node ]; then
            tmp=$(mktemp -d)
            cd "$tmp"
            archive=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/linux-x64.tar.xz$/ {print $2; exit}')
            test -n "$archive"
            curl -fsSLO "https://nodejs.org/dist/latest-v22.x/$archive"
            mkdir -p /opt/node22
            tar -xJf "$archive" -C /opt/node22 --strip-components=1
            rm -rf "$tmp"
          fi
          /opt/node22/bin/node --version
          mkdir -p /var/www/satori/crm-v2 /var/lib/satori-auto-crm
          chown -R www-data:www-data /var/lib/satori-auto-crm
          REMOTE

      - name: Replace Auto-CRM application without touching SQLite data
        run: |
          ssh root@194.226.97.103 'systemctl stop satori-crm-v2 2>/dev/null || true'
          rsync -az --delete /tmp/satori-auto-crm-runtime/ root@194.226.97.103:/var/www/satori/crm-v2/
          ssh root@194.226.97.103 'chown -R www-data:www-data /var/www/satori/crm-v2'

      - name: Start Auto-CRM on 3020
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          cat >/etc/systemd/system/satori-crm-v2.service <<'UNIT'
          [Unit]
          Description=Satori Auto-CRM v2 (MIT)
          After=network.target

          [Service]
          Type=simple
          User=www-data
          Group=www-data
          WorkingDirectory=/var/www/satori/crm-v2
          ExecStart=/opt/node22/bin/node /var/www/satori/crm-v2/server.js
          Restart=always
          RestartSec=3
          Environment=NODE_ENV=production
          Environment=PORT=3020
          Environment=HOSTNAME=127.0.0.1
          Environment=CRM_DB_PATH=/var/lib/satori-auto-crm/crm.db
          Environment=NEXT_TELEMETRY_DISABLED=1
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable satori-crm-v2 >/dev/null 2>&1 || true
          systemctl restart satori-crm-v2
          systemctl is-active --quiet satori-crm-v2

          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:3020/api/pipeline >/tmp/satori-auto-pipeline.json
          node_count=$(python3 - <<'PY'
          import json
          print(len(json.load(open('/tmp/satori-auto-pipeline.json'))))
          PY
          )
          test "$node_count" -ge 1
          REMOTE

      - name: Expose only the signed Need Number webhook through CRM Basic Auth
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          cfg=/etc/nginx/conf.d/satori-crm.conf
          test -f "$cfg"
          if ! grep -q 'SATORI NEED NUMBER WEBHOOK' "$cfg"; then
            CFG="$cfg" python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path(os.environ['CFG'])
          s = p.read_text()
          marker = '# SATORI NEED NUMBER WEBHOOK'
          proxy = re.search(r'(?m)^\s*proxy_pass\s+http://127\.0\.0\.1:3020\s*;', s)
          if not proxy:
              raise SystemExit('Auto-CRM proxy_pass 3020 not found')
          before = s[:proxy.start()]
          locations = list(re.finditer(r'(?m)^(?P<i>\s*)location\s+[^\n{]+\{', before))
          if not locations:
              raise SystemExit('CRM location block not found')
          loc = locations[-1]
          indent = loc.group('i')
          block = f'''{indent}{marker}\n{indent}location = /api/integrations/need-number {{\n{indent}  auth_basic off;\n{indent}  proxy_pass http://127.0.0.1:3020;\n{indent}  proxy_http_version 1.1;\n{indent}  proxy_set_header Host $host;\n{indent}  proxy_set_header X-Forwarded-Host $host;\n{indent}  proxy_set_header X-Forwarded-Proto $scheme;\n{indent}  proxy_set_header X-Real-IP $remote_addr;\n{indent}  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n{indent}}}\n\n'''
          s = s[:loc.start()] + block + s[loc.start():]
          p.write_text(s)
          PY
          fi
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Initialize Satori pipeline only for an empty database
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          contacts=$(curl -fsS http://127.0.0.1:3020/api/contacts)
          deals=$(curl -fsS http://127.0.0.1:3020/api/deals)
          state=$(python3 - "$contacts" "$deals" <<'PY'
          import json, sys
          has_data = bool(len(json.loads(sys.argv[1])) or len(json.loads(sys.argv[2])))
          print('existing' if has_data else 'empty')
          PY
          )
          if [ "$state" = 'existing' ]; then
            echo 'Existing CRM data detected; preserving current pipeline and migrated records'
          else
            curl --fail --silent --show-error -X PUT http://127.0.0.1:3020/api/pipeline \
              -H 'Content-Type: application/json' \
              --data '{"stages":[{"name":"Новый запрос","order":1,"color":"#64748b"},{"name":"Расчёт","order":2,"color":"#2563eb"},{"name":"Согласовано","order":3,"color":"#8b5cf6"},{"name":"В производстве","order":4,"color":"#ea580c"},{"name":"Готово","order":5,"color":"#0f766e"},{"name":"Доставка","order":6,"color":"#0891b2"},{"name":"Завершено","order":7,"color":"#16a34a","isWon":true},{"name":"Отказ","order":8,"color":"#dc2626","isLost":true}]}' \
              >/tmp/satori-auto-stages.json
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/satori-auto-stages.json'))
          assert len(data) == 8, data
          print('Satori pipeline ready:', ', '.join(x['name'] for x in data))
          PY
          fi
          REMOTE

      - name: Verify Russian UI, integrations, cleanup worker and rollback
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -eu
          curl --fail --silent http://127.0.0.1:3020/ | grep -q 'Главная'
          curl --fail --silent http://127.0.0.1:3020/settings | grep -q 'Need Number'
          curl --fail --silent http://127.0.0.1:3020/api/integrations/settings >/tmp/satori-integrations.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/satori-integrations.json'))
          assert data.get('needNumberWebhookPath','').startswith('/api/integrations/need-number?key=')
          print('Integration settings ready; Telegram configured:', bool(data.get('telegramConfigured')))
          PY
          curl --fail --silent http://127.0.0.1:3020/api/contacts >/dev/null
          curl --fail --silent http://127.0.0.1:3020/api/deals >/dev/null
          curl --fail --silent http://127.0.0.1:3020/api/pipeline | grep -q 'Новый запрос'
          curl --fail --silent http://127.0.0.1:3020/sw.js | grep -q 'cleanup worker'
          curl --fail --silent https://crm.satorilabural.online/api/integrations/need-number | grep -q 'Need Number'
          systemctl is-active --quiet satori-crm
          curl --fail --silent http://127.0.0.1:3010/health >/dev/null
          rm -rf /var/lib/satori-crm-v2
          REMOTE
