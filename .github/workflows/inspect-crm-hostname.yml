name: Inspect CRM hostname routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crm-hostname.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect production nginx and CRM services
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          echo '=== CRM nginx server blocks ==='
          nginx -T 2>&1 | grep -n -B12 -A45 'server_name .*crm.crmsatori.ru' || true
          echo '=== CRM upstream ports in nginx ==='
          nginx -T 2>&1 | grep -n -B5 -A12 -E '127\.0\.0\.1:(3020|3030)' || true
          echo '=== UI service state ==='
          systemctl is-active satori-crm-ui || true
          systemctl show satori-crm-ui -p ExecStart -p WorkingDirectory --no-pager || true
          echo '=== UI deployed VERSION ==='
          cat /var/www/satori/crm-new-ui/VERSION 2>/dev/null || true
          echo
          echo '=== UI dist assets ==='
          sed -n '1,120p' /var/www/satori/crm-new-ui/dist/index.html 2>/dev/null || true
          find /var/www/satori/crm-new-ui/dist/assets -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | tail -20 || true
          echo '=== local service responses ==='
          curl -sS -D - -o /tmp/ui-login.html http://127.0.0.1:3030/login | head -20 || true
          curl -sS -D - -o /dev/null http://127.0.0.1:3020/login | head -20 || true
          curl -sS -o /dev/null -w '3030 health: %{http_code}\n' http://127.0.0.1:3030/health || true
          curl -sS -o /dev/null -w '3020 deals: %{http_code}\n' http://127.0.0.1:3020/api/deals || true
          echo '=== public host headers ==='
          curl -skI --resolve crm.crmsatori.ru:443:192.168.0.38 https://crm.crmsatori.ru/login | head -30 || true
          echo '=== public DNS ==='
          dig +short @1.1.1.1 crm.crmsatori.ru A
          dig +short @8.8.8.8 crm.crmsatori.ru A
          REMOTE
