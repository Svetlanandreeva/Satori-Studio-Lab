name: Inspect CRM hostname routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crm-hostname.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect production nginx and CRM services
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          echo '=== all crm host declarations ==='
          nginx -T 2>&1 | grep -n -B5 -A12 'server_name .*crm.crmsatori.ru' || true
          echo '=== all 443 listen directives near crm blocks ==='
          nginx -T 2>&1 | grep -n -B20 -A20 'ssl_certificate /etc/letsencrypt/live/crm.crmsatori.ru' || true
          echo '=== presented certificate for crm SNI ==='
          echo | openssl s_client -connect 192.168.0.38:443 -servername crm.crmsatori.ru 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          echo '=== target certificate file ==='
          openssl x509 -in /etc/letsencrypt/live/crm.crmsatori.ru/fullchain.pem -noout -subject -issuer -ext subjectAltName || true
          echo '=== HTTPS request ignoring cert ==='
          curl -skI --resolve crm.crmsatori.ru:443:192.168.0.38 https://crm.crmsatori.ru/login | head -30 || true
          echo '=== public DNS ==='
          dig +short @1.1.1.1 crm.crmsatori.ru A
          dig +short @8.8.8.8 crm.crmsatori.ru A
          REMOTE
