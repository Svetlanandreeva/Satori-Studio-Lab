name: Inspect CRM hostname routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crm-hostname.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts
      - name: Inspect production nginx, deployed UI and client history linkage
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set +e
          echo '=== public routing ==='
          nginx -T 2>&1 | grep -n -B5 -A20 'server_name .*crm.crmsatori.ru' || true
          nginx -T 2>&1 | grep -n -B3 -A8 -E 'proxy_pass http://127\.0\.0\.1:(3020|3030)' || true
          echo '=== UI deployed VERSION ==='
          cat /var/www/satori/crm-new-ui/VERSION 2>/dev/null || true
          echo
          echo '=== API linkage audit ==='
          /opt/node22/bin/node - <<'NODE'
          const base='http://127.0.0.1:3020';
          const get=async p=>{const r=await fetch(base+p); if(!r.ok) throw new Error(`${p}: ${r.status}`); return r.json()};
          (async()=>{
            const [contactsRaw,deals,inbox,tg]=await Promise.all([
              get('/api/contacts'), get('/api/deals'), get('/api/inbox?filter=client&search='), get('/api/messages/telegram?search=')
            ]);
            const contacts=Array.isArray(contactsRaw)?contactsRaw:(contactsRaw.contacts||[]);
            const emailThreads=Array.isArray(inbox.threads)?inbox.threads:[];
            const telegramThreads=Array.isArray(tg.threads)?tg.threads:[];
            console.log(JSON.stringify({
              contacts:contacts.length,
              deals:Array.isArray(deals)?deals.length:0,
              emailThreads:emailThreads.length,
              emailThreadsLinked:emailThreads.filter(x=>x.contactId).length,
              telegramThreads:telegramThreads.length,
              telegramThreadsLinked:telegramThreads.filter(x=>x.contactId||x.id).length,
              uniqueDealContacts:new Set((Array.isArray(deals)?deals:[]).map(x=>x.contactId).filter(Boolean)).size,
            },null,2));
            let contactsWithHistory=0, dealContactsWithHistory=0, dealContactsChecked=0, totalHistory=0;
            const historyById=new Map();
            for(const c of contacts.slice(0,120)){
              try{const t=await get(`/api/contacts/${encodeURIComponent(c.id)}/timeline`); const n=Array.isArray(t.history)?t.history.length:0; historyById.set(c.id,n); if(n){contactsWithHistory++; totalHistory+=n}}catch{}
            }
            for(const id of new Set((Array.isArray(deals)?deals:[]).map(x=>x.contactId).filter(Boolean))){
              dealContactsChecked++;
              let n=historyById.get(id);
              if(n===undefined){try{const t=await get(`/api/contacts/${encodeURIComponent(id)}/timeline`); n=Array.isArray(t.history)?t.history.length:0}catch{n=0}}
              if(n) dealContactsWithHistory++;
            }
            console.log(JSON.stringify({contactsWithHistory,totalHistory,dealContactsChecked,dealContactsWithHistory},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          echo '=== public host ==='
          curl -skI --resolve crm.crmsatori.ru:443:192.168.0.38 https://crm.crmsatori.ru/login | head -20 || true
          REMOTE
