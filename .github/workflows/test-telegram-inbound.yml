name: Test Telegram inbound CRM

on:
  push:
    branches: [feature/telegram-inbound]
    paths:
      - 'crm-v2/**'
      - '.github/workflows/test-telegram-inbound.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Auto-CRM
        run: |
          git clone --filter=blob:none https://github.com/Hainrixz/auto-crm.git /tmp/satori-auto-crm
          cd /tmp/satori-auto-crm
          git checkout --detach 0aef51a9aef0487c59b964b4eea9d964a2321f0c
      - name: Apply deployment base patch and overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/satori-auto-crm')
          p = root / 'next.config.ts'
          s = p.read_text()
          s = s.replace('const nextConfig: NextConfig = {\n  serverExternalPackages: ["better-sqlite3"],\n};', 'const nextConfig: NextConfig = {\n  output: "standalone",\n  serverExternalPackages: ["better-sqlite3"],\n};')
          p.write_text(s)
          p = root / 'src/db/index.ts'
          s = p.read_text().replace('const DB_PATH = path.join(process.cwd(), "data", "crm.db");', 'const DB_PATH = process.env.CRM_DB_PATH || path.join(process.cwd(), "data", "crm.db");')
          p.write_text(s)
          PY
          python3 crm-v2/russianize.py
          cp -a crm-v2/overrides/src/. /tmp/satori-auto-crm/src/
      - name: Build
        working-directory: /tmp/satori-auto-crm
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js
