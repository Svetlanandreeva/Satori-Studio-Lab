name: Fix pipeline stage typecheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pipeline-stage-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stage history query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crm-v2/overrides/src/app/api/pipeline/route.ts')
          s=p.read_text()
          old='db.select({ id: dealStageHistory.id }).from(dealStageHistory).all().find(row => row.fromStageId === stage.id || row.toStageId === stage.id)'
          new='db.select({ id: dealStageHistory.id, fromStageId: dealStageHistory.fromStageId, toStageId: dealStageHistory.toStageId }).from(dealStageHistory).all().find(row => row.fromStageId === stage.id || row.toStageId === stage.id)'
          if old not in s:
            raise SystemExit('Patch target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'Satori CRM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add crm-v2/overrides/src/app/api/pipeline/route.ts
          git commit -m 'Fix pipeline stage history typecheck'
          git push
