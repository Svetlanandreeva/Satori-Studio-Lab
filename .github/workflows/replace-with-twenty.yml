name: Replace CRM with Twenty

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-with-twenty.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Twenty CRM source
        run: |
          git clone --depth 1 https://github.com/twentyhq/twenty.git /tmp/twenty
          rm -rf /tmp/twenty/.git

      - name: Replace current CRM with Twenty
        shell: bash
        run: |
          set -euo pipefail

          # Preserve this migration workflow unchanged so GitHub does not need
          # the Actions token to modify workflow files during the source import.
          cp .github/workflows/replace-with-twenty.yml /tmp/replace-with-twenty.yml

          # Remove the old Satori application tree.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy the official Twenty source tree.
          cp -a /tmp/twenty/. .

          # Upstream workflow files are intentionally omitted for the initial import.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/replace-with-twenty.yml .github/workflows/replace-with-twenty.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Satori CRM with Twenty CRM"
          git push origin HEAD:main
