name: Diagnose CRM public network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crm-network.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: External DNS and HTTPS probe
        run: |
          echo '=== DNS ==='
          getent ahostsv4 crm.satorilabural.online || true
          echo '=== TCP 80 ==='
          timeout 8 bash -c '</dev/tcp/crm.satorilabural.online/80' && echo '80 reachable' || echo '80 timeout/refused'
          echo '=== TCP 443 ==='
          timeout 8 bash -c '</dev/tcp/crm.satorilabural.online/443' && echo '443 reachable' || echo '443 timeout/refused'
          echo '=== HTTP ==='
          curl -vI --connect-timeout 8 --max-time 15 http://crm.satorilabural.online/ || true
          echo '=== HTTPS ==='
          curl -vkI --connect-timeout 8 --max-time 15 https://crm.satorilabural.online/ || true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - run: ssh-keyscan -H 194.226.97.103 >> ~/.ssh/known_hosts

      - name: Inspect VPS network and local HTTPS
        run: |
          ssh root@194.226.97.103 'bash -se' <<'REMOTE'
          set -u
          echo '=== addresses ==='
          ip -br -4 addr || true
          ip -4 route || true
          echo '=== listeners ==='
          ss -ltnp | grep -E ':(22|80|443|3010|3020|3030)\b' || true
          echo '=== UFW ==='
          ufw status verbose 2>&1 || true
          echo '=== iptables INPUT ==='
          iptables -S INPUT 2>&1 || true
          echo '=== nft input snippets ==='
          nft list ruleset 2>/dev/null | grep -E -C 3 '(hook input|tcp dport|443|80)' | head -160 || true
          echo '=== nginx CRM config ==='
          grep -RIn -A35 -B5 'crm\.satorilabural\.online' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -180 || true
          echo '=== HTTPS via private interface ==='
          PRIVATE_IP=$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | head -1)
          echo "PRIVATE_IP=$PRIVATE_IP"
          curl -vkI --connect-timeout 5 --max-time 12 --resolve crm.satorilabural.online:443:${PRIVATE_IP} https://crm.satorilabural.online/ || true
          echo '=== HTTP via localhost ==='
          curl -vI --connect-timeout 5 --max-time 12 -H 'Host: crm.satorilabural.online' http://127.0.0.1/ || true
          REMOTE
